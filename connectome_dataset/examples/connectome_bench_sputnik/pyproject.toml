[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "connectome-bench-sputnik"
version = "0.0.1"
description = "Out-of-tree Sputnik SpMM provider for the connectome benchmark suite"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

# The out-of-tree contract: this entry point makes Sputnik discoverable by
# connectome_dataset.benchmarks.providers.discover_spmm with no change to that repo.
# Requires libconnectome_sputnik.so (cmake -DCONNECTOME_BENCH_BUILD_SPUTNIK=ON).
[project.entry-points."connectome_bench.spmm"]
sputnik = "connectome_bench_sputnik:get_providers"

[tool.hatch.build.targets.wheel]
packages = ["connectome_bench_sputnik"]
