[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "connectome-bench-vdha"
version = "0.0.1"
description = "Out-of-tree VDHA SpMSpV provider for the connectome benchmark suite"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

# The out-of-tree contract: this entry point makes VDHA discoverable by
# connectome_dataset.benchmarks.providers.discover_spmspv with no change to that repo.
# Requires libconnectome_vdha.so (scripts/build_vdha.sh).
[project.entry-points."connectome_bench.spmspv"]
vdha = "connectome_bench_vdha:get_providers"

[tool.hatch.build.targets.wheel]
packages = ["connectome_bench_vdha"]
