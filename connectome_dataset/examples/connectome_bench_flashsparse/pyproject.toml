[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "connectome-bench-flashsparse"
version = "0.0.1"
description = "Out-of-tree FlashSparse (tensor-core SpMM) provider for the connectome benchmark suite"
requires-python = ">=3.10"
dependencies = ["numpy"]

# Requires FlashSparse's FS_SpMM + FS_Block extensions built via scripts/build_flashsparse.sh.
[project.entry-points."connectome_bench.spmm"]
flashsparse = "connectome_bench_flashsparse:get_providers"

[tool.hatch.build.targets.wheel]
packages = ["connectome_bench_flashsparse"]
