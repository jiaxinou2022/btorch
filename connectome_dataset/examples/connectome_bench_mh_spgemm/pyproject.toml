[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "connectome-bench-mh-spgemm"
version = "0.0.1"
description = "Out-of-tree MH-SpGEMM SpGEMM provider for the connectome benchmark suite"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

# The out-of-tree contract: this entry point makes MH-SpGEMM discoverable by
# connectome_dataset.benchmarks.providers.discover_spgemm with no change to that repo.
# Requires libconnectome_mh_spgemm.so (scripts/build_mh_spgemm.sh).
[project.entry-points."connectome_bench.spgemm"]
mh_spgemm = "connectome_bench_mh_spgemm:get_providers"

[tool.hatch.build.targets.wheel]
packages = ["connectome_bench_mh_spgemm"]
